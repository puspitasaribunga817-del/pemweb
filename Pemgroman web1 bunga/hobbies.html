<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hobbies.html</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h3.page-label {
            color: #a0c4ff;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            align-self: flex-start;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 35px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        h2 {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 12px;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 60px; height: 4px;
            background: linear-gradient(90deg, #f72585, #7209b7);
            border-radius: 2px;
        }

        p { color: #c0c0c0; font-size: 0.95rem; margin-bottom: 12px; }

        ul { list-style: none; padding: 0; margin-bottom: 28px; }

        ul li {
            color: #e0e0e0;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: rgba(247,37,133,0.1);
            border-left: 4px solid #f72585;
            border-radius: 0 8px 8px 0;
            font-size: 0.92rem;
            transition: all 0.3s ease;
        }

        ul li:hover {
            background: rgba(247,37,133,0.25);
            transform: translateX(6px);
        }

        ul li::before { content: '✦ '; color: #f72585; font-size: 0.75rem; }

        h3.subheading {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
            position: relative;
            padding-bottom: 10px;
        }

        h3.subheading::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 45px; height: 3px;
            background: linear-gradient(90deg, #7209b7, #3a0ca3);
            border-radius: 2px;
        }

        ol { list-style: none; padding: 0; counter-reset: ol-counter; }

        ol li {
            counter-increment: ol-counter;
            color: #e0e0e0;
            padding: 10px 15px 10px 50px;
            margin-bottom: 8px;
            background: rgba(114,9,183,0.1);
            border-radius: 8px;
            font-size: 0.92rem;
            position: relative;
            transition: all 0.3s ease;
        }

        ol li::before {
            content: counter(ol-counter, upper-alpha) '.';
            position: absolute;
            left: 15px;
            color: #7209b7;
            font-weight: 700;
            font-size: 1rem;
        }

        ol li:hover {
            background: rgba(114,9,183,0.25);
            transform: translateX(6px);
        }
    </style>
</head>
<body>
    <h3 class="page-label">🎮 hobbies.html</h3>
    <div class="card">
        <h2>Hobi</h2>
        <p>Beberapa hobi saya adalah:</p>
        <ul>
            <li>Membaca</li>
            <li>Traveling</li>
            <li>Fotografi</li>
            <li>Nonton Film</li>
        </ul>

        <h3 class="subheading">Urutan Hobi Favorit</h3>
        <ol>
            <li>Nonton Film</li>
            <li>Membaca</li>
            <li>Fotografi</li>
            <li>Traveling</li>
        </ol>
    </div>
</body>
</html>
