<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form.html</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h3.page-label {
            color: #a0c4ff;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            align-self: flex-start;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        h2 {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
            padding-bottom: 14px;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #48cae4, #0096c7);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #a0c4ff;
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="url"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #48cae4;
            background: rgba(72, 202, 228, 0.1);
            box-shadow: 0 0 0 3px rgba(72, 202, 228, 0.15);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .radio-item,
        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .radio-item input,
        .check-item input {
            width: 16px;
            height: 16px;
            accent-color: #48cae4;
            cursor: pointer;
        }

        .radio-item label,
        .check-item label {
            color: #c0c0c0;
            font-size: 0.875rem;
            margin: 0;
            cursor: pointer;
        }

        input[type="file"] {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #a0c4ff;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        input[type="submit"] {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #48cae4, #0096c7);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(72, 202, 228, 0.4);
        }

        input[type="reset"] {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #a0c4ff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="reset"]:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #48cae4;
        }
    </style>
</head>
<body>
    <h3 class="page-label">📋 form.html</h3>
    <div class="card">
        <h2>Formulir Pendaftaran</h2>
        <form action="#" method="post">

            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="nama@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-group">
                <label for="umur">Umur:</label>
                <input type="number" id="umur" name="umur" min="1" max="100">
            </div>

            <div class="form-group">
                <label for="tgl_lahir">Tanggal Lahir:</label>
                <input type="date" id="tgl_lahir" name="tgl_lahir">
            </div>

            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="laki" name="jenis_kelamin" value="laki">
                        <label for="laki">Laki-laki</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan">
                        <label for="perempuan">Perempuan</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Hobi:</label>
                <div class="checkbox-group">
                    <div class="check-item">
                        <input type="checkbox" id="membaca" name="hobi" value="membaca">
                        <label for="membaca">Membaca</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="traveling" name="hobi" value="traveling">
                        <label for="traveling">Traveling</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="fotografi" name="hobi" value="fotografi">
                        <label for="fotografi">Fotografi</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="nonton" name="hobi" value="nonton">
                        <label for="nonton">Nonton Film</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan:</label>
                <select id="jurusan" name="jurusan">
                    <option value="">-- Pilih Jurusan --</option>
                    <option value="si">Sistem Informasi</option>
                    <option value="ti">Teknik Informatika</option>
                    <option value="mi">Manajemen Informatika</option>
                </select>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" name="alamat" placeholder="Masukkan alamat"></textarea>
            </div>

            <div class="form-group">
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="form-group">
                <label for="website">Website:</label>
                <input type="url" id="website" name="website" placeholder="https://example.com">
            </div>

            <div class="btn-group">
                <input type="submit" value="Kirim">
                <input type="reset" value="Reset">
            </div>

        </form>
    </div>
</body>
</html>
