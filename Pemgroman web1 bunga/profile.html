<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile.html</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h3.page-label {
            color: #a0c4ff;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            align-self: flex-start;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .avatar-wrapper img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid transparent;
            background: linear-gradient(135deg, #e94560, #0f3460) border-box;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }

        .avatar-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px dashed rgba(233, 69, 96, 0.5);
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 18px 0;
        }

        h4 {
            color: #a0c4ff;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        p {
            color: #c0c0c0;
            font-size: 0.875rem;
            line-height: 1.7;
            text-align: left;
        }

        p strong {
            color: #ffffff;
        }

        .highlight {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 14px;
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <h3 class="page-label">👤 profile.html</h3>
    <div class="card">
        <h2>Profil Mahasiswa</h2>

        <div class="avatar-wrapper">
            <img src="Kim Mingyu.jpg" alt="Foto Profil">
            <div class="avatar-ring"></div>
        </div>

        <div class="divider"></div>

        <h4>Data Diri</h4>
        <p>Nama saya <strong>Bunga Puspita Sari</strong>. Saya adalah mahasiswa <em>Sistem Informasi</em>.</p>
        <p>Saya sedang mempelajari <strong>HTML</strong>, <strong>CSS</strong>, dan <strong>JavaScript</strong>.</p>
        <p>Target saya adalah menjadi Data Analyst</p>
        <span class="highlight">Web Developer</span>
    </div>
</body>

</html>
