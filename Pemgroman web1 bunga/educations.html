<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>educations.html</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h3.page-label {
            color: #a0c4ff;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            align-self: flex-start;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        h2 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 12px;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #e94560, #0f3460);
            border-radius: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        caption {
            color: #a0c4ff;
            font-size: 0.9rem;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        thead th {
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: white;
            padding: 12px 15px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        thead th:first-child {
            border-radius: 8px 0 0 0;
        }

        thead th:last-child {
            border-radius: 0 8px 0 0;
        }

        tbody tr {
            transition: background 0.3s ease;
        }

        tbody tr:nth-child(odd) {
            background: rgba(255, 255, 255, 0.06);
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        tbody tr:hover {
            background: rgba(233, 69, 96, 0.15);
            transform: scale(1.01);
        }

        tbody td {
            color: #e0e0e0;
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        tbody td:first-child {
            color: #e94560;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <h3 class="page-label">📄 educations.html</h3>
    <div class="card">
        <h2>Riwayat Pendidikan</h2>
        <table>
            <caption>Riwayat Pendidikan</caption>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Jenjang</th>
                    <th>Nama Sekolah</th>
                    <th>Tahun</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>SD</td>
                    <td>MI Imadun Najah</td>
                    <td>2011 - 2016</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>SMP</td>
                    <td>MTsN 38</td>
                    <td>2017 - 2020</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>SMA</td>
                    <td>SMAN 102 Jakarta</td>
                    <td>2020 - 2023</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>S1</td>
                    <td>Universitas MANDIRI</td>
                    <td>2026 - Sekarang</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
